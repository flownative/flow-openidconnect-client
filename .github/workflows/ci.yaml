name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }}${{ matrix.flow-version != '' && format(', Flow {0}', matrix.flow-version) || '' }})

    runs-on: ${{ matrix.os }}

    env:
      PHP_EXTENSIONS: json, libxml, mbstring
      PHP_INI_VALUES: assert.exception=1, zend.assertions=1, pcov.directory=Classes

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

        php-version:
          - "8.3"
          - "8.4"
          - "8.5"

        dependencies:
          - lowest
          - highest

        # Empty means the Flow version to which the dependencies resolve: 8.3 for lowest, the latest 9.x for highest
        flow-version:
          - ''

        include:
          - { os: ubuntu-latest, php-version: "8.3", dependencies: highest, flow-version: "~8.4.0" }
          - { os: ubuntu-latest, php-version: "8.4", dependencies: highest, flow-version: "~8.4.0" }
          - { os: ubuntu-latest, php-version: "8.5", dependencies: highest, flow-version: "~8.4.0" }
          - { os: ubuntu-latest, php-version: "8.3", dependencies: lowest, flow-version: "~9.0.0" }
          - { os: ubuntu-latest, php-version: "8.4", dependencies: lowest, flow-version: "~9.0.0" }
          - { os: ubuntu-latest, php-version: "8.5", dependencies: lowest, flow-version: "~9.0.0" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI_VALUES }}

      - name: Determine composer cache directory on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-flow${{ matrix.flow-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-flow${{ matrix.flow-version }}-

      - name: Restrict the Flow version
        if: matrix.flow-version != ''
        run: composer require --no-ansi --no-interaction --no-update "neos/flow:${{ matrix.flow-version }}"

      - name: Install lowest dependencies with composer
        if: matrix.dependencies == 'lowest'
        run: composer update --no-ansi --no-interaction --no-progress --prefer-lowest

      - name: Install highest dependencies with composer
        if: matrix.dependencies == 'highest'
        run: composer update --no-ansi --no-interaction --no-progress

      - name: Show modules
        run: php -i; php -m

      - name: Run tests with phpunit
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Send code coverage report to Codecov.io
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
